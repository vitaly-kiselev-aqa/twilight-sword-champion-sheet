<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Лист Чемпиона — Twilight Sword</title>
    <meta
      name="description"
      lang="en"
      content="Онлайн-лист персонажа для Twilight Sword (Сумеречный Меч)"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/sheet.css" />
    <link rel="stylesheet" href="assets/css/card.css" />
    <script src="assets/js/model.js" defer></script>
    <script src="assets/js/storage.js" defer></script>
    <script src="assets/js/fields.js" defer></script>
    <script src="assets/js/sheet.js" defer></script>
  </head>
  <body>
    <main class="sheet">
      <section class="card sheet__champion" aria-labelledby="champion-title">
        <h2 class="visually-hidden" id="champion-title">Чемпион</h2>
      </section>

      <section
        class="card sheet__attributes"
        aria-labelledby="attributes-title"
      >
        <h2 class="visually-hidden" id="attributes-title">Характеристики</h2>
      </section>

      <section class="card sheet__equipment" aria-labelledby="equipment-title">
        <h2 class="card__title" id="equipment-title">Снаряжение</h2>
      </section>

      <section class="card sheet__inventory" aria-labelledby="inventory-title">
        <h2 class="card__title" id="inventory-title">Инвентарь</h2>
      </section>

      <section class="card sheet__traits" aria-labelledby="traits-title">
        <h2 class="card__title" id="traits-title">Черты и Заклинания</h2>
      </section>
    </main>
  </body>
</html>
